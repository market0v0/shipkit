# AI PR review with Claude Code.
# Copy to .github/workflows/ai-pr-review.yml in your repo and add an
# ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions).
name: AI PR review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    # Skip drafts; secrets are not available to PRs from forks.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out.
            Report only real defects you can tie to a concrete failure scenario:
            logic errors, data loss, security issues, money or timezone mistakes,
            and broken contracts. Skip style and naming nitpicks.

            Post each finding as an inline comment on the exact line, then one
            short summary comment with the count of findings and whether you
            would approve as-is. If you find nothing, say so in the summary.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
